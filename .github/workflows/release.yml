# Push a tag like v1.0.0 and this builds Charles.exe and attaches it to a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches VERSION in desk_cat.py
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import re, sys
          version = re.search(r'^VERSION = "([^"]+)"', open("desk_cat.py", encoding="utf-8").read(), re.M).group(1)
          if "${{ github.ref_name }}" != "v" + version:
              sys.exit(f"tag ${{ github.ref_name }} doesn't match VERSION = {version!r} in desk_cat.py")
      - run: pip install -r requirements.txt pyinstaller
      - run: python tools/build_exe.py
      - uses: actions/upload-artifact@v4
        with:
          name: Charles
          path: dist/Charles.exe
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Charles.exe
          generate_release_notes: true
