# Push a tag like v1.0.0 and this builds Charles.exe and attaches it to a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches VERSION in desk_cat.py
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import re, sys
          version = re.search(r'^VERSION = "([^"]+)"', open("desk_cat.py", encoding="utf-8").read(), re.M).group(1)
          if "${{ github.ref_name }}" != "v" + version:
              sys.exit(f"tag ${{ github.ref_name }} doesn't match VERSION = {version!r} in desk_cat.py")
      - run: pip install -r requirements.txt pyinstaller
      - run: python tools/build_exe.py
      - uses: actions/upload-artifact@v4
        with:
          name: Charles
          path: dist/Charles.exe
      - name: Checksum, for the release notes
        id: sum
        shell: bash
        run: echo "sha=$(sha256sum dist/Charles.exe | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Charles.exe
          generate_release_notes: true
          body: |
            ### Check it's the real file
            SHA-256 of `Charles.exe`: `${{ steps.sum.outputs.sha }}`
            In PowerShell: `Get-FileHash .\Charles.exe` should print the same hash.
            [VirusTotal scan](https://www.virustotal.com/gui/file/${{ steps.sum.outputs.sha }})

            Windows may warn that Charles is unsafe: she isn't code-signed (certificates cost hundreds a year).
            Click **More info → Run anyway**. [More about that](https://github.com/yad2thisyazm/charles-chocolate-the-charles-the-2nd#the-easy-way)

